<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Special Matrix For MY QUEEN ❤️</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #0b0c10;
            overflow: hidden;
            font-family: 'Consolas', 'Courier New', monospace;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }

        .text-container {
            position: absolute;
            bottom: 12vh;
            text-align: center;
            z-index: 10;
            pointer-events: none;
            width: 100%;
        }

        .main-title {
            color: #ffffff;
            font-size: 2.2rem;
            font-weight: 900;
            letter-spacing: 2px;
            text-shadow: 0 0 12px rgba(255, 255, 255, 0.9);
            margin-bottom: 12px;
        }

        .status-tag {
            color: #00f0ff;
            font-size: 0.95rem;
            font-weight: bold;
            margin-bottom: 10px;
            letter-spacing: 1px;
        }

        .footer-tag {
            color: #aaaaaa;
            font-size: 0.85rem;
        }

        .footer-tag span {
            color: #ff3366;
        }
    </style>
</head>
<body>

    <canvas id="canvas"></canvas>

    <div class="text-container">
        <div class="main-title">YOU ARE MY WHOLE UNIVERSE, MY QUEEN</div>
        <div class="status-tag">[ status: connected_forever.exe ]</div>
        <div class="footer-tag">coded with 💕 by YOGESH <span>YOUR NAME</span></div>
    </div>

    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        resizeCanvas();
        window.addEventListener('resize', resizeCanvas);

        // Heart Formula
        function getHeartPoint(t) {
            const x = 16 * Math.pow(Math.sin(t), 3);
            const y = -(13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t));
            return { x, y };
        }

        const particles = [];
        const colors = ['#ff3366', '#ff4d88', '#ff66b2', '#ff0055', '#ff99dd', '#ffffff'];

        class Particle {
            constructor() {
                this.reset();
            }

            reset() {
                this.t = Math.random() * Math.PI * 2;
                const pos = getHeartPoint(this.t);
                
                // Scale according to screen size
                const scale = Math.min(canvas.width, canvas.height) / 45;
                
                this.targetX = canvas.width / 2 + pos.x * scale;
                this.targetY = canvas.height / 2 - (canvas.height * 0.08) + pos.y * scale;

                // Scatter effect around heart line
                this.x = this.targetX + (Math.random() - 0.5) * 35;
                this.y = this.targetY + (Math.random() - 0.5) * 35;

                this.size = Math.random() * 3 + 1.2;
                this.color = colors[Math.floor(Math.random() * colors.length)];
                
                this.vx = (Math.random() - 0.5) * 0.6;
                this.vy = (Math.random() - 0.5) * 0.6;
                this.alpha = Math.random() * 0.8 + 0.2;
            }

            update() {
                this.x += this.vx;
                this.y += this.vy;

                // Keep particles near heart shape
                const dx = this.x - this.targetX;
                const dy = this.y - this.targetY;
                if (Math.sqrt(dx * dx + dy * dy) > 25) {
                    this.vx *= -1;
                    this.vy *= -1;
                }
            }

            draw() {
                ctx.save();
                ctx.globalAlpha = this.alpha;
                ctx.fillStyle = this.color;
                ctx.shadowBlur = 10;
                ctx.shadowColor = this.color;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            }
        }

        // Background Stars
        const stars = [];
        for(let i = 0; i < 150; i++) {
            stars.push({
                x: Math.random() * canvas.width,
                y: Math.random() * canvas.height,
                size: Math.random() * 1.5,
                alpha: Math.random()
            });
        }

        // Initialize Heart Particles
        for (let i = 0; i < 650; i++) {
            particles.push(new Particle());
        }

        function animate() {
            ctx.fillStyle = '#0b0c10';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Draw Stars
            stars.forEach(star => {
                ctx.fillStyle = `rgba(255, 255, 255, ${star.alpha})`;
                ctx.fillRect(star.x, star.y, star.size, star.size);
            });

            // Draw Heart
            particles.forEach(p => {
                p.update();
                p.draw();
            });

            requestAnimationFrame(animate);
        }

        animate();
    </script>
</body>
</html>
